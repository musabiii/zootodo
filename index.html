<!doctype html>
<html lang="ru" data-theme="zoo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZooTodo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=Cormorant+SC:wght@600;700&family=Exo+2:wght@200;300;400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Theme: Зоопарк (default) ---------- */
:root {
  --bg: #f4f1eb;
  --surface: #ffffff;
  --on-ink: #ffffff;     /* text on --ink fills */
  --on-c: #ffffff;       /* text on category fills */
  --ink: #1c2320;
  --muted: #6c736f;
  --line: #e6e1d7;
  --side: #16201b;
  --side-2: #1f2b25;
  --side-ink: #e8eee9;
  --side-muted: #8fa198;
  --accent: #c9a24a;
  --brand: linear-gradient(135deg, #d47a1f, #b65a12);
  --display: Lora, Georgia, serif;
  --side-art:
    radial-gradient(circle at 15% 105%, rgba(212,122,31,.18), transparent 45%),
    radial-gradient(circle at 110% 0%, rgba(47,138,88,.22), transparent 50%);

  --urgent: #d47a1f;     --urgent-bg: #fbefe1;      /* гепард */
  --important: #7a5233;  --important-bg: #f1e8df;   /* медведь */
  --unpleasant: #2f8a58; --unpleasant-bg: #e6f3eb;  /* лягушка */
  --regular: #3d7c86;    --regular-bg: #e3f0f1;     /* волк */
  --quick: #7b52c9;      --quick-bg: #f0eafb;       /* комар */
  --long: #56668a;       --long-bg: #eaeef6;        /* слон */

  --radius: 14px;
  --shadow: 0 1px 2px rgba(28,35,32,.05), 0 4px 16px rgba(28,35,32,.05);
}

/* ---------- Theme: Космос ---------- */
[data-theme="space"] {
  --bg: #eef0f7;
  --ink: #161a33;
  --muted: #646b85;
  --line: #dde1ef;
  --side: #0c1029;
  --side-2: #1a2050;
  --side-ink: #e7e9ff;
  --side-muted: #8b92c6;
  --accent: #8ad8ff;
  --brand: linear-gradient(135deg, #5b4bd6, #b8467f);
  --display: Unbounded, Manrope, sans-serif;
  --side-art:
    radial-gradient(1px 1px at 24px 36px, rgba(255,255,255,.75), transparent),
    radial-gradient(1px 1px at 96px 128px, rgba(255,255,255,.55), transparent),
    radial-gradient(1.5px 1.5px at 168px 64px, rgba(255,255,255,.85), transparent),
    radial-gradient(1px 1px at 232px 188px, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 52px 214px, rgba(255,255,255,.6), transparent),
    radial-gradient(1.5px 1.5px at 140px 246px, rgba(138,216,255,.8), transparent),
    radial-gradient(circle at 110% 0%, rgba(184,70,127,.35), transparent 50%),
    radial-gradient(circle at -10% 100%, rgba(47,115,196,.4), transparent 50%);

  --urgent: #e5603c;     --urgent-bg: #fdebe5;      /* комета */
  --important: #c8961a;  --important-bg: #fbf3dc;   /* звезда */
  --unpleasant: #4a3a8c; --unpleasant-bg: #ebe8f6;  /* чёрная дыра */
  --regular: #2f73c4;    --regular-bg: #e5effb;     /* спутник */
  --quick: #0f9aa6;      --quick-bg: #e0f4f5;       /* метеор */
  --long: #b8467f;       --long-bg: #f8e6ef;        /* галактика */

  --shadow: 0 1px 2px rgba(22,26,51,.06), 0 4px 16px rgba(22,26,51,.06);
}

/* ---------- Theme: RPG-бестиарий ---------- */
[data-theme="rpg"] {
  --bg: #f3ece0;
  --surface: #fffdf8;
  --ink: #2a1f17;
  --muted: #7a6b5c;
  --line: #e4d8c4;
  --side: #22160f;
  --side-2: #352419;
  --side-ink: #f2e6d4;
  --side-muted: #b09a80;
  --accent: #d4a63c;
  --brand: linear-gradient(135deg, #a52a3a, #5e1420);
  --display: "Cormorant SC", Lora, serif;
  --side-art:
    repeating-linear-gradient(45deg, rgba(255,255,255,.018) 0 2px, transparent 2px 9px),
    radial-gradient(circle at 10% 105%, rgba(224,98,42,.28), transparent 45%),
    radial-gradient(circle at 110% -5%, rgba(212,166,60,.22), transparent 50%);

  --urgent: #e0622a;     --urgent-bg: #fdeee4;      /* феникс */
  --important: #a52a3a;  --important-bg: #f7e3e5;   /* дракон */
  --unpleasant: #6f9a1f; --unpleasant-bg: #eef5df;  /* слизень */
  --regular: #8a6d2f;    --regular-bg: #f5eedf;     /* гоблин */
  --quick: #77706a;      --quick-bg: #efedeb;       /* крыса */
  --long: #4b6a8a;       --long-bg: #e6edf4;        /* голем */

  --shadow: 0 1px 2px rgba(42,31,23,.06), 0 4px 16px rgba(42,31,23,.07);
}

/* ---------- Theme: Киберпанк (игровой, тёмный) ---------- */
[data-theme="cyber"] {
  --bg: #05050a;
  --surface: #0c0c16;
  --ink: #e9f6ff;
  --on-ink: #05050a;
  --on-c: #05050a;
  --muted: #7b7fa6;
  --line: #1f1f35;
  --side: #08080f;
  --side-2: #141428;
  --side-ink: #e9f6ff;
  --side-muted: #7b7fa6;
  --accent: #00f0ff;
  --pink: #ff2e88;
  --gold: #fcee0a;
  --brand: linear-gradient(135deg, #ff2e88, #7a1cff);
  --display: "Exo 2", Manrope, sans-serif;
  --side-art:
    repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px),
    radial-gradient(circle at 110% 0%, rgba(255,46,136,.25), transparent 50%),
    radial-gradient(circle at -10% 100%, rgba(0,240,255,.18), transparent 50%);

  --urgent: #ff2e4d;     --urgent-bg: rgba(255,46,77,.13);      /* тревога */
  --important: #fcee0a;  --important-bg: rgba(252,238,10,.11);  /* контракт */
  --unpleasant: #00f0ff; --unpleasant-bg: rgba(0,240,255,.11);  /* лёд */
  --regular: #c4c8ff;    --regular-bg: rgba(196,200,255,.1);    /* заказ */
  --quick: #3dff9a;      --quick-bg: rgba(61,255,154,.1);       /* точка доступа */
  --long: #ff2e88;       --long-bg: rgba(255,46,136,.12);       /* сюжет */

  --radius: 2px;
  --shadow: 0 0 0 1px rgba(255,255,255,.03);
  color-scheme: dark;
}

/* ---------- Theme: Трон (светящаяся Сетка, тёмный) ---------- */
[data-theme="tron"] {
  --bg: #020407;
  --surface: #06121a;
  --ink: #dffcff;
  --on-ink: #021014;
  --on-c: #021014;
  --muted: #5f8b96;
  --line: #0f2a33;
  --side: #020407;
  --side-2: #07161d;
  --side-ink: #dffcff;
  --side-muted: #5f8b96;
  --accent: #19e6ff;
  --orange: #ff7a1a;
  --brand: #020407;
  --display: "Exo 2", Manrope, sans-serif;
  --side-art:
    linear-gradient(transparent 0 calc(100% - 1px), rgba(25,230,255,.07) 0) 0 0 / 100% 32px,
    linear-gradient(90deg, transparent 0 calc(100% - 1px), rgba(25,230,255,.07) 0) 0 0 / 32px 100%;

  --urgent: #19e6ff;     --urgent-bg: rgba(25,230,255,.1);      /* световой цикл */
  --important: #f2ffff;  --important-bg: rgba(242,255,255,.08); /* диск */
  --unpleasant: #ff5a1f; --unpleasant-bg: rgba(255,90,31,.11);  /* распознаватель */
  --regular: #2f8bff;    --regular-bg: rgba(47,139,255,.12);    /* программа */
  --quick: #ffe14d;      --quick-bg: rgba(255,225,77,.1);       /* бит */
  --long: #ffb46b;       --long-bg: rgba(255,180,107,.1);       /* портал */

  --shadow: 0 0 14px -6px rgba(25,230,255,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: Manrope, system-ui, sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  transition: background-color .3s;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
svg.ico .fill { fill: currentColor; stroke: none; }

.app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }

/* ---------- Sidebar ---------- */
.side {
  background-color: var(--side);
  background-image: var(--side-art);
  color: var(--side-ink);
  padding: 24px 16px;
  display: flex; flex-direction: column; gap: 20px;
  position: sticky; top: 0; height: 100vh;
}
[data-theme="space"] .side { background-size: 260px 280px, 260px 280px, 260px 280px, 260px 280px, 260px 280px, 260px 280px, 100% 100%, 100% 100%; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center;
  background: var(--brand);
  color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
}
.brand-mark svg.ico { width: 24px; height: 24px; }
.brand h1 { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 0; letter-spacing: .2px; }
.brand small { display: block; color: var(--side-muted); font-size: 12px; margin-top: 1px; }

.side-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--side-muted); padding: 0 10px; font-weight: 600; }
.proj-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.proj {
  display: flex; align-items: center; gap: 12px;
  padding: 10px; border-radius: 10px;
  color: var(--side-ink); background: transparent; border: 0; width: 100%; text-align: left;
  transition: background .15s;
  position: relative;
}
.proj:hover { background: rgba(255,255,255,.05); }
.proj.active { background: var(--side-2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.proj.active::before {
  content: ""; position: absolute; left: -16px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
}
.proj-badge {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
  background: rgba(255,255,255,.07); color: var(--side-ink);
}
.proj.active .proj-badge { background: var(--accent); color: var(--side); }
.proj-name { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-count { font-size: 12px; color: var(--side-muted); font-variant-numeric: tabular-nums; }
.proj-del {
  opacity: 0; border: 0; background: none; color: var(--side-muted); padding: 2px; border-radius: 6px; display: grid;
}
.proj:hover .proj-del { opacity: 1; }
.proj:hover .proj-count { display: none; }
.proj-del:hover { color: #ff9b8a; }
.proj-del svg.ico { width: 16px; height: 16px; }

.add-proj { display: flex; gap: 6px; padding: 0 2px; }
.add-proj input {
  flex: 1; min-width: 0; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
  border-radius: 10px; padding: 9px 12px; color: var(--side-ink); outline: none;
}
.add-proj input::placeholder { color: var(--side-muted); }
.add-proj input:focus { border-color: var(--accent); }
.add-proj button {
  border: 0; border-radius: 10px; width: 38px; background: var(--accent); color: var(--side); display: grid; place-items: center;
}

.legend { margin-top: auto; display: grid; gap: 8px; padding: 14px; border-radius: 12px; background: rgba(255,255,255,.04); }
.legend-row { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--side-muted); }
.legend-row b { color: var(--side-ink); font-weight: 600; }
.legend-row .dot { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; }
.legend-row svg.ico { width: 17px; height: 17px; }

.theme-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.05); color: var(--side-ink);
  border-radius: 12px; padding: 8px 12px 8px 8px; transition: background .15s;
}
.theme-btn:hover { background: rgba(255,255,255,.08); }
.theme-btn .brand-mark { flex: none; width: 30px; height: 30px; border-radius: 8px; }
.theme-btn .brand-mark svg.ico { width: 18px; height: 18px; }
.theme-btn .label { flex: 1; min-width: 0; }
.theme-btn small { display: block; font-size: 11px; color: var(--side-muted); text-transform: uppercase; letter-spacing: 1.2px; font-weight: 600; }
.theme-btn b { display: block; font-size: 13.5px; font-weight: 600; }
.theme-btn .chev { width: 16px; height: 16px; color: var(--side-muted); transform: rotate(-90deg); transition: transform .15s; }
.theme-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }

/* ---------- Main ---------- */
.main { padding: 40px clamp(16px, 4vw, 56px) 64px; max-width: 920px; width: 100%; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.head h2 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 4vw, 38px); margin: 0; letter-spacing: -.3px; cursor: text; }
.head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.stripe { height: 4px; border-radius: 4px; margin: 20px 0 24px; display: flex; overflow: hidden; background: var(--line); }
.stripe span { transition: flex-grow .3s; }

.composer {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  border: 1px solid var(--line);
}
.composer input {
  flex: 1 1 240px; min-width: 0; border: 0; outline: none; padding: 10px 8px; font-size: 15px; background: transparent;
}
.cat-btn {
  border: 0; border-radius: 10px; padding: 9px 10px 9px 12px; min-width: 150px;
  display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700;
  color: var(--c); background: var(--cbg);
}
.cat-btn span { flex: 1; text-align: left; white-space: nowrap; }
.cat-btn .chev, .tag .chev { width: 14px; height: 14px; transform: rotate(90deg); opacity: .7; transition: transform .15s; }
.cat-btn[aria-expanded="true"] .chev, .tag[aria-expanded="true"] .chev { transform: rotate(-90deg); }

.menu {
  position: fixed; z-index: 50; min-width: 250px; max-width: calc(100vw - 16px); padding: 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 12px 40px rgba(28,35,32,.18), 0 2px 6px rgba(28,35,32,.06);
  animation: pop .12s ease-out;
}
.menu[hidden] { display: none; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.menu .menu-title { padding: 8px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 700; }
.menu button + .menu-title { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.menu button {
  width: 100%; border: 0; background: none; border-radius: 10px; padding: 8px 10px;
  display: flex; align-items: center; gap: 12px; text-align: left;
}
.menu button:hover, .menu button:focus-visible { background: var(--bg); outline: none; }
.menu .mi { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.menu b { display: block; font-size: 14px; }
.menu small { display: block; color: var(--muted); font-size: 12px; }
.menu .tick { margin-left: auto; color: var(--c, var(--ink)); width: 18px; height: 18px; stroke-width: 2.2; }
.composer .go {
  border: 0; border-radius: 10px; padding: 10px 18px; background: var(--ink); color: var(--on-ink); font-weight: 600;
}
.composer .go:hover { opacity: .88; }

.filters { display: flex; gap: 8px; margin: 22px 0 8px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 10px;
  display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted);
}
.chip svg.ico { width: 16px; height: 16px; }
.chip em { font-style: normal; font-variant-numeric: tabular-nums; opacity: .7; }
.chip.on { color: var(--on-ink); border-color: transparent; background: var(--ink); }
.chip.on[class*="k-"] { color: var(--on-c); background: var(--c); }

.group { margin-top: 26px; }
.group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.group-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.group-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
.group-head small { color: var(--muted); font-size: 12.5px; }
.group-head .n { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.task {
  background: var(--surface); border-radius: 12px; border: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; position: relative; overflow: hidden;
  transition: box-shadow .15s, transform .15s;
}
.task::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.task:hover { box-shadow: var(--shadow); }
.check {
  width: 22px; height: 22px; border-radius: 50%; flex: none; border: 2px solid var(--c); background: transparent;
  display: grid; place-items: center; padding: 0; color: var(--on-c);
}
.check svg.ico { width: 14px; height: 14px; stroke-width: 2.6; opacity: 0; }
.task.done .check { background: var(--c); }
.task.done .check svg.ico { opacity: 1; }
.task-title { flex: 1; min-width: 0; font-size: 15px; line-height: 1.4; word-break: break-word; }
.task.done .task-title { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.task-title input { width: 100%; border: 0; outline: none; border-bottom: 1px solid var(--c); padding: 2px 0; font-size: 15px; background: transparent; }
.tag {
  border: 0; border-radius: 8px; padding: 5px 9px; display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; color: var(--c); background: var(--cbg); flex: none;
}
.tag svg.ico { width: 16px; height: 16px; }
.del { border: 0; background: none; color: var(--muted); opacity: 0; padding: 4px; border-radius: 6px; display: grid; }
.task:hover .del { opacity: .8; }
.del:hover { color: #e0453a; background: color-mix(in srgb, #e0453a 12%, transparent); }
.del svg.ico { width: 17px; height: 17px; }

.done-toggle { margin-top: 28px; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center; padding: 0; }
.done-toggle svg.ico { width: 16px; height: 16px; transition: transform .2s; }
.done-toggle.open svg.ico { transform: rotate(90deg); }

.empty { text-align: center; padding: 56px 16px; color: var(--muted); }
.empty .cats { display: flex; justify-content: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.empty .cats div { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.empty .cats svg.ico { width: 24px; height: 24px; }
.empty h4 { font-family: var(--display); font-weight: 600; color: var(--ink); font-size: 20px; margin: 0 0 4px; }

/* per-category colors (values come from the active theme) */
.k-urgent     { --c: var(--urgent);     --cbg: var(--urgent-bg); }
.k-important  { --c: var(--important);  --cbg: var(--important-bg); }
.k-unpleasant { --c: var(--unpleasant); --cbg: var(--unpleasant-bg); }
.k-regular    { --c: var(--regular);    --cbg: var(--regular-bg); }
.k-quick      { --c: var(--quick);      --cbg: var(--quick-bg); }
.k-long       { --c: var(--long);       --cbg: var(--long-bg); }
.tinted { color: var(--c); background: var(--cbg); }

/* zoo: cheetah spots */
[data-theme="zoo"] .group-icon.k-urgent, [data-theme="zoo"] .tag.k-urgent {
  background-image: radial-gradient(circle at 20% 30%, rgba(212,122,31,.14) 2px, transparent 2.5px),
                    radial-gradient(circle at 70% 75%, rgba(212,122,31,.14) 2px, transparent 2.5px);
  background-size: 12px 12px;
  background-color: var(--cbg);
}
/* space: faint starfield on group icons */
[data-theme="space"] .group-icon {
  background-image: radial-gradient(1px 1px at 6px 8px, var(--c), transparent),
                    radial-gradient(1px 1px at 27px 25px, var(--c), transparent);
  background-color: var(--cbg);
}

/* rpg: sigil-like rim on group icons, engraved headings */
[data-theme="rpg"] .group-icon { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 35%, transparent); }
[data-theme="rpg"] .head h2 { font-weight: 700; letter-spacing: .5px; }
[data-theme="rpg"] .brand h1 { font-weight: 700; font-size: 23px; letter-spacing: .5px; }

/* ---------- Game HUD, job meta, reward toast (shown in the cyber theme) ---------- */
.hud, .job-meta { display: none; }
.toast {
  position: fixed; right: 24px; bottom: 24px; z-index: 60; max-width: calc(100vw - 32px);
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  font-size: 12.5px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--c); background: var(--surface); border: 1px solid var(--c);
  box-shadow: 0 0 24px -4px var(--c);
  transition: opacity .25s, transform .25s;
}
.toast[hidden] { display: flex; opacity: 0; transform: translateY(12px); pointer-events: none; }
.toast b { color: var(--gold, var(--ink)); }

[data-theme="cyber"] body { font-family: "JetBrains Mono", monospace; }
[data-theme="cyber"] body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px);
}
[data-theme="cyber"] .task-title, [data-theme="cyber"] input { font-family: Manrope, sans-serif; }
[data-theme="cyber"] .side { border-right: 1px solid color-mix(in srgb, var(--pink) 45%, transparent); box-shadow: 8px 0 30px -18px var(--pink); }
[data-theme="cyber"] .brand h1 { font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; font-size: 20px; }
[data-theme="cyber"] .head h2 {
  font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
  text-shadow: 0 0 12px rgba(0,240,255,.55), 2px 0 var(--pink), -2px 0 var(--accent);
  animation: glitch 3.5s infinite steps(1);
}
@keyframes glitch {
  0%, 91%, 100% { transform: none; }
  92% { transform: translate(2px, -1px) skewX(-6deg); }
  94% { transform: translate(-2px, 1px); }
  96% { transform: translate(1px, 0) skewX(4deg); }
}
[data-theme="cyber"] .head p { text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
[data-theme="cyber"] .group-head h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: 1.5px; font-size: 14px; }
[data-theme="cyber"] .group-icon, [data-theme="cyber"] .tag, [data-theme="cyber"] .cat-btn { border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
[data-theme="cyber"] .group-icon svg.ico, [data-theme="cyber"] .tag svg.ico { filter: drop-shadow(0 0 5px var(--c)); }
[data-theme="cyber"] .chip { border-radius: 2px; text-transform: uppercase; font-size: 11.5px; letter-spacing: .5px; }
[data-theme="cyber"] .chip.on[class*="k-"] { box-shadow: 0 0 14px -2px var(--c); }
[data-theme="cyber"] .composer .go { background: var(--pink); color: #05050a; box-shadow: 0 0 16px -2px var(--pink); text-transform: uppercase; letter-spacing: 1px; }
[data-theme="cyber"] .stripe span { box-shadow: 0 0 8px var(--c, transparent); }

/* job cards: HUD corners instead of the left stripe */
[data-theme="cyber"] .task {
  border-color: color-mix(in srgb, var(--c) 40%, var(--line));
  background: linear-gradient(90deg, color-mix(in srgb, var(--c) 9%, var(--surface)), var(--surface) 60%);
  box-shadow: 0 0 18px -9px var(--c); overflow: visible; align-items: flex-start;
}
[data-theme="cyber"] .task::before, [data-theme="cyber"] .task::after {
  content: ""; position: absolute; width: 10px; height: 10px; border: 2px solid var(--c); background: none;
}
[data-theme="cyber"] .task::before { top: -1px; left: -1px; bottom: auto; border-right: 0; border-bottom: 0; }
[data-theme="cyber"] .task::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
[data-theme="cyber"] .task:hover { box-shadow: 0 0 24px -6px var(--c); }
[data-theme="cyber"] .task .check { border-radius: 2px; transform: rotate(45deg) scale(.85); margin-top: 2px; }
[data-theme="cyber"] .task .check svg.ico { transform: rotate(-45deg); }
[data-theme="cyber"] .task.done .check { box-shadow: 0 0 12px var(--c); }
[data-theme="cyber"] .task.done { opacity: .7; }
[data-theme="cyber"] .task .tag, [data-theme="cyber"] .task .del { margin-top: -2px; }

.task-body { flex: 1; min-width: 0; }
[data-theme="cyber"] .job-meta { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 11px; flex-wrap: wrap; }
.threat { display: flex; gap: 2px; }
.threat i { width: 5px; height: 10px; background: var(--c); box-shadow: 0 0 6px var(--c); }
.threat i.off { background: var(--line); box-shadow: none; }
.reward { color: var(--gold); text-shadow: 0 0 8px rgba(252,238,10,.45); }
.status { margin-left: auto; padding: 2px 7px; border: 1px solid var(--c); color: var(--c); text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
.status.hot { background: var(--c); color: #05050a; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .45; } }

/* HUD: level, XP, stats */
[data-theme="cyber"] .hud { display: block; margin-top: 14px; }
.hud-top { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
.hud-top span:last-child { color: var(--pink); }
.lvl { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 11px; text-transform: uppercase; }
.lvl b { color: var(--gold); text-shadow: 0 0 8px rgba(252,238,10,.6); }
.xp { flex: 1; height: 8px; background: var(--side-2); border: 1px solid var(--line); position: relative; }
.xp i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--pink), var(--accent)); box-shadow: 0 0 12px var(--pink); transition: width .4s; }
.xp-n { color: var(--muted); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat { position: relative; border: 1px solid var(--line); padding: 8px 10px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.stat b { display: block; font-size: 17px; color: var(--ink); margin-top: 2px; letter-spacing: 0; }
.stat.hot b { color: var(--pink); text-shadow: 0 0 10px var(--pink); }
.stat.gold b { color: var(--gold); }
.stat::before, .stat::after { content: ""; position: absolute; width: 8px; height: 8px; border: 2px solid var(--sc, var(--accent)); }
.stat::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.stat::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

/* ---------- Tron: neon outlines, light trails, grid floor ---------- */
[data-theme="tron"] body::before {
  content: ""; position: fixed; left: -50%; right: -50%; bottom: -60px; height: 46vh; pointer-events: none; z-index: 0;
  background:
    linear-gradient(transparent 0 calc(100% - 1px), rgba(25,230,255,.45) 0) 0 0 / 100% 42px,
    linear-gradient(90deg, transparent 0 calc(100% - 1px), rgba(25,230,255,.45) 0) 0 0 / 42px 100%;
  transform: perspective(320px) rotateX(64deg); transform-origin: bottom;
  -webkit-mask-image: linear-gradient(transparent, #000 75%); mask-image: linear-gradient(transparent, #000 75%);
}
[data-theme="tron"] .app { position: relative; z-index: 1; }
[data-theme="tron"] .side { border-right: 1px solid rgba(25,230,255,.35); box-shadow: 6px 0 26px -16px var(--accent); }
[data-theme="tron"] .brand-mark, [data-theme="tron"] .mbar button.brand-mark {
  border-radius: 50%; background: var(--bg); color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent), 0 0 14px var(--accent), inset 0 0 10px -2px var(--accent);
}
[data-theme="tron"] .brand h1 { font-weight: 300; text-transform: uppercase; letter-spacing: 4px; font-size: 18px; text-shadow: 0 0 10px rgba(25,230,255,.6); }
[data-theme="tron"] .proj.active::before { box-shadow: 0 0 10px var(--accent); }
[data-theme="tron"] .head h2 {
  font-weight: 200; text-transform: uppercase; letter-spacing: 9px; color: #fff;
  text-shadow: 0 0 6px var(--accent), 0 0 22px rgba(25,230,255,.6);
}
[data-theme="tron"] .head p { text-transform: uppercase; letter-spacing: 3px; font-size: 11.5px; font-family: var(--display); }
[data-theme="tron"] .stripe { height: 2px; }
[data-theme="tron"] .stripe span { box-shadow: 0 0 8px var(--c, var(--accent)); }
[data-theme="tron"] .composer { border-color: var(--accent); background: rgba(2,10,14,.85); box-shadow: 0 0 14px -4px var(--accent), inset 0 0 18px -10px var(--accent); }
[data-theme="tron"] .cat-btn, [data-theme="tron"] .composer .go, [data-theme="tron"] .chip, [data-theme="tron"] .tag {
  border-radius: 999px; font-family: var(--display); text-transform: uppercase;
}
[data-theme="tron"] .cat-btn { background: transparent; border: 1px solid var(--c); letter-spacing: 2px; font-weight: 400; box-shadow: 0 0 10px -3px var(--c); }
[data-theme="tron"] .composer .go { background: var(--accent); color: var(--on-ink); letter-spacing: 3px; box-shadow: 0 0 18px var(--accent); }
[data-theme="tron"] .chip { background: transparent; letter-spacing: 1.5px; font-size: 11.5px; font-weight: 400; }
[data-theme="tron"] .chip svg.ico { filter: drop-shadow(0 0 4px var(--c, var(--accent))); }
[data-theme="tron"] .chip[class*="k-"] svg.ico { color: var(--c); }
[data-theme="tron"] .chip.on, [data-theme="tron"] .chip.on[class*="k-"] {
  background: transparent; color: var(--c, var(--accent)); border-color: var(--c, var(--accent)); box-shadow: 0 0 10px -3px var(--c, var(--accent));
}
[data-theme="tron"] .group-icon { border-radius: 50%; background: transparent; border: 1px solid var(--c); box-shadow: 0 0 10px -2px var(--c), inset 0 0 8px -3px var(--c); }
[data-theme="tron"] .group-head h3 { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: 3px; color: var(--c); text-shadow: 0 0 8px var(--c); }
[data-theme="tron"] .task {
  background: rgba(2,10,14,.82); border-color: color-mix(in srgb, var(--c) 30%, transparent); overflow: visible;
}
[data-theme="tron"] .task::before {
  left: 14px; top: -1px; bottom: auto; width: 38%; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, var(--c)); box-shadow: 0 0 8px var(--c);
}
[data-theme="tron"] .task::after {
  content: ""; position: absolute; right: -1px; top: 12px; bottom: 12px; width: 2px; border-radius: 2px;
  background: var(--c); box-shadow: 0 0 8px var(--c); opacity: .8;
}
[data-theme="tron"] .task:hover { box-shadow: 0 0 20px -8px var(--c); }
[data-theme="tron"] .check { box-shadow: 0 0 8px -1px var(--c), inset 0 0 6px -2px var(--c); }
[data-theme="tron"] .task.done .check { background: radial-gradient(circle, var(--c) 0 35%, transparent 40%); }
[data-theme="tron"] .task.done .check svg.ico { opacity: 0; }
[data-theme="tron"] .tag { background: transparent; border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); letter-spacing: 1.5px; font-weight: 400; }
[data-theme="tron"] .legend .dot { border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1px var(--c), 0 0 8px -3px var(--c); }

@media (prefers-reduced-motion: reduce) {
  [data-theme="cyber"] .head h2, .status.hot { animation: none; }
}

/* ---------- Mobile bar ---------- */
.mbar { display: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .main { padding: 24px 16px calc(96px + env(safe-area-inset-bottom)); }
  .composer .go, .cat-btn { flex: 1; }
  .del { opacity: .6; }
  .tag span { display: none; }
  .mbar {
    display: flex; gap: 8px; align-items: center;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background-color: var(--side); background-image: var(--side-art); color: var(--side-ink);
    box-shadow: 0 -6px 24px rgba(0,0,0,.12);
  }
  .mbar .sel { position: relative; flex: 1; min-width: 0; }
  .mbar select {
    appearance: none; -webkit-appearance: none; width: 100%;
    background: var(--side-2); color: var(--side-ink); border: 1px solid rgba(255,255,255,.08);
    border-radius: 11px; padding: 11px 36px 11px 14px; font-weight: 600; font-size: 15px; outline: none;
  }
  .mbar .sel svg.ico { position: absolute; right: 12px; top: 50%; transform: translateY(-50%) rotate(90deg); color: var(--side-muted); pointer-events: none; width: 16px; height: 16px; }
  .mbar button { border: 0; width: 42px; height: 42px; border-radius: 11px; background: var(--accent); color: var(--side); display: grid; place-items: center; flex: none; }
  .mbar button.ghost { background: var(--side-2); color: var(--side-muted); }
  .mbar button.brand-mark { background: var(--brand); color: #fff; }
  .toast { left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); }
  [data-theme="tron"] body::before { bottom: calc(40px + env(safe-area-inset-bottom)); height: 40vh; }
  [data-theme="tron"] .mbar { border-top: 1px solid var(--accent); box-shadow: 0 -6px 22px -10px var(--accent); }
  [data-theme="tron"] .mbar select { border-radius: 999px; }
  [data-theme="tron"] .mbar button:not(.brand-mark) { border-radius: 50%; }
  [data-theme="tron"] .mbar button#mAdd { background: transparent; color: var(--orange); box-shadow: inset 0 0 0 1px var(--orange), 0 0 12px -2px var(--orange); }
  [data-theme="cyber"] .mbar { border-top: 1px solid var(--pink); box-shadow: 0 -8px 24px -12px var(--pink); }
  .stat b { font-size: 15px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><svg class="ico"><use id="brandIcon" href="#i-zoo-urgent"/></svg></div>
      <div><h1 id="brandTitle">ZooTodo</h1><small id="brandTag">задачи по характеру</small></div>
    </div>
    <div class="side-label">Проекты</div>
    <ul class="proj-list" id="projList"></ul>
    <form class="add-proj" id="addProj">
      <input id="projInput" placeholder="Новый проект…" maxlength="40">
      <button aria-label="Добавить проект"><svg class="ico"><use href="#i-plus"/></svg></button>
    </form>
    <div class="legend" id="legend"></div>
    <button type="button" class="theme-btn" id="themeBtn" aria-haspopup="menu" aria-expanded="false"></button>
  </aside>

  <main class="main">
    <div class="head">
      <div>
        <h2 id="projTitle" title="Двойной клик — переименовать"></h2>
        <p id="projSub"></p>
      </div>
    </div>
    <div class="hud" id="hud"></div>
    <div class="stripe" id="stripe"></div>

    <form class="composer" id="composer">
      <input id="taskInput" placeholder="Что нужно сделать?" maxlength="200" autocomplete="off">
      <button type="button" class="cat-btn" id="pickBtn" aria-haspopup="menu" aria-expanded="false"></button>
      <button class="go">Добавить</button>
    </form>

    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </main>
</div>

<nav class="mbar">
  <button class="brand-mark" id="mTheme" aria-label="Вселенная" aria-haspopup="menu" aria-expanded="false"><svg class="ico"><use id="mThemeIcon" href="#i-zoo-urgent"/></svg></button>
  <div class="sel">
    <select id="projSelect" aria-label="Проект"></select>
    <svg class="ico"><use href="#i-chev"/></svg>
  </div>
  <button class="ghost" id="mDel" aria-label="Удалить проект"><svg class="ico"><use href="#i-trash"/></svg></button>
  <button id="mAdd" aria-label="Новый проект"><svg class="ico"><use href="#i-plus"/></svg></button>
</nav>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

const XP_PER_LEVEL = 500;

const LEGACY = { cheetah: 'urgent', bear: 'important', frog: 'unpleasant', wolf: 'regular', mosquito: 'quick', elephant: 'long' };

const KEY = 'zootodo.v1';

const theme = () => THEMES[state.theme] || THEMES.zoo;

const plainName = (k) => SHORT[k][0].toUpperCase() + SHORT[k].slice(1);
const cat = (k) => state.plainNames
  ? { ...theme().cats[k], name: plainName(k), plural: plainName(k) }
  : theme().cats[k];
const svg = (id, cls = 'ico') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const icon = (k) => svg(ORDER.includes(k) ? `${state.theme}-${k}` : k);
const chev = svg('chev', 'ico chev');
const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function seed() {
  const t = (title, cat, done = false) => ({ id: uid(), title, cat, done, created: Date.now() });
  const work = { id: uid(), name: 'Работа', tasks: [
    t('Отправить отчёт за квартал до 18:00', 'urgent'),
    t('Согласовать бюджет с директором', 'important'),
    t('Позвонить недовольному клиенту', 'unpleasant'),
    t('Провести еженедельную планёрку', 'regular'),
    t('Ответить на письмо бухгалтерии', 'quick'),
    t('Подготовить стратегию на следующий год', 'long'),
    t('Разобрать входящие', 'quick', true),
  ]};
  const home = { id: uid(), name: 'Дом', tasks: [
    t('Разобрать гардероб', 'unpleasant'),
    t('Оплатить интернет', 'quick'),
    t('Ремонт на балконе', 'long'),
  ]};
  const study = { id: uid(), name: 'Английский', tasks: [
    t('Дочитать книгу в оригинале', 'long'),
    t('Повторить 20 слов', 'quick'),
  ]};
  return { projects: [work, home, study], activeId: work.id, theme: 'zoo', stats: newStats() };
}

function newStats() { return { xp: 0, credits: 0, days: [] }; }

function migrate(s) {
  s.theme = THEMES[s.theme] ? s.theme : 'zoo';
  s.stats = { ...newStats(), ...s.stats };
  s.plainNames = !!s.plainNames;
  for (const p of s.projects) for (const t of p.tasks) {
    if (t.animal) { t.cat = LEGACY[t.animal]; delete t.animal; }
    if (!ORDER.includes(t.cat)) t.cat = DEFAULT_CAT;
  }
  return s;
}

let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch {}
state = state && Array.isArray(state.projects) ? migrate(state) : seed();
let ui = { filter: 'all', newCat: DEFAULT_CAT, showDone: false, editing: null };

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const active = () => state.projects.find((p) => p.id === state.activeId) || state.projects[0];
const $ = (id) => document.getElementById(id);

const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

// Consecutive days with at least one completed task, ending today (or yesterday if nothing is done yet today).
function streak() {
  const days = new Set(state.stats.days);
  const d = new Date();
  if (!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(dayKey(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function fmt(n) { return n.toLocaleString('ru-RU'); }

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

/* ---------- Render ---------- */
function renderTheme() {
  const th = theme();
  document.documentElement.dataset.theme = state.theme;
  document.title = th.title;
  $('brandTitle').textContent = th.title;
  $('brandTag').textContent = th.tagline;
  $('brandIcon').setAttribute('href', `#i-${th.brandIcon}`);
  $('mThemeIcon').setAttribute('href', `#i-${th.brandIcon}`);
  $('themeBtn').innerHTML =
    `<span class="brand-mark">${svg(th.brandIcon)}</span><span class="label"><small>Вселенная${state.plainNames ? ' · станд. названия' : ''}</small><b>${th.label}</b></span>${chev}`;
}

function render() {
  const p = active();
  if (p && state.activeId !== p.id) state.activeId = p.id;
  renderTheme();

  // sidebar
  $('projList').innerHTML = state.projects.map((pr) => {
    const open = pr.tasks.filter((x) => !x.done).length;
    return `<li><button class="proj ${pr.id === state.activeId ? 'active' : ''}" data-proj="${pr.id}">
      <span class="proj-badge">${esc(pr.name.trim()[0] || '•').toUpperCase()}</span>
      <span class="proj-name">${esc(pr.name)}</span>
      <span class="proj-count">${open || ''}</span>
      <span class="proj-del" data-delproj="${pr.id}" title="Удалить">${svg('x')}</span>
    </button></li>`;
  }).join('');

  $('legend').innerHTML = ORDER.map((k) =>
    `<div class="legend-row k-${k}"><span class="dot tinted">${icon(k)}</span><div><b>${cat(k).name}</b>${state.plainNames ? '' : ` · ${SHORT[k]}`}</div></div>`
  ).join('');

  // mobile select
  $('projSelect').innerHTML = state.projects.map((pr) => {
    const open = pr.tasks.filter((x) => !x.done).length;
    return `<option value="${pr.id}" ${pr.id === state.activeId ? 'selected' : ''}>${esc(pr.name)}${open ? ` · ${open}` : ''}</option>`;
  }).join('');

  // composer category dropdown
  $('pickBtn').className = `cat-btn k-${ui.newCat}`;
  $('pickBtn').innerHTML = `${icon(ui.newCat)}<span>${cat(ui.newCat).name}</span>${chev}`;

  if (!p) {
    $('projTitle').textContent = 'Нет проектов';
    $('projSub').textContent = 'Создайте первый проект';
    $('hud').innerHTML = ''; $('stripe').innerHTML = ''; $('filters').innerHTML = ''; $('list').innerHTML = '';
    $('composer').style.display = 'none';
    return;
  }
  $('composer').style.display = '';

  const open = p.tasks.filter((x) => !x.done);
  const done = p.tasks.filter((x) => x.done);
  $('projTitle').textContent = p.name;
  $('projSub').textContent = open.length
    ? `${open.length} ${plural(open.length, 'задача', 'задачи', 'задач')} в работе${done.length ? ` · ${done.length} готово` : ''}`
    : done.length ? 'Всё сделано — отличная работа' : 'Пока пусто';

  const counts = Object.fromEntries(ORDER.map((k) => [k, open.filter((x) => x.cat === k).length]));
  $('hud').innerHTML = theme().game ? hudHtml(counts.urgent) : '';
  $('stripe').innerHTML = ORDER.map((k) => `<span style="flex-grow:${counts[k]};background:var(--${k})"></span>`).join('');

  $('filters').innerHTML =
    `<button class="chip ${ui.filter === 'all' ? 'on' : ''}" data-filter="all">${svg('all')}Все <em>${open.length}</em></button>` +
    ORDER.map((k) => `<button class="chip k-${k} ${ui.filter === k ? 'on' : ''}" data-filter="${k}">${icon(k)}${cat(k).plural} <em>${counts[k]}</em></button>`).join('');

  const shown = ORDER.filter((k) => ui.filter === 'all' || ui.filter === k);
  let html = shown.map((k) => {
    const items = open.filter((x) => x.cat === k);
    if (!items.length) return '';
    return `<section class="group">
      <div class="group-head k-${k}">
        <div class="group-icon tinted k-${k}">${icon(k)}</div>
        <div><h3>${cat(k).plural}</h3><small>${cat(k).hint}</small></div>
        <span class="n">${items.length}</span>
      </div>
      <ul class="tasks">${items.map(taskHtml).join('')}</ul>
    </section>`;
  }).join('');

  if (!html.trim()) {
    html = `<div class="empty">
      <div class="cats">${ORDER.map((k) => `<div class="tinted k-${k}">${icon(k)}</div>`).join('')}</div>
      <h4>${ui.filter === 'all' ? 'Здесь тихо' : state.plainNames ? `«${cat(ui.filter).name}» — задач нет` : `${cat(ui.filter).plural} ${theme().absent}`}</h4>
      <div>Добавьте задачу и выберите ей ${theme().pickWhat}</div>
    </div>`;
  }

  const doneShown = done.filter((x) => ui.filter === 'all' || x.cat === ui.filter);
  if (doneShown.length) {
    html += `<button class="done-toggle ${ui.showDone ? 'open' : ''}" data-toggledone>${svg('chev')}Выполнено · ${doneShown.length}</button>`;
    if (ui.showDone) html += `<ul class="tasks" style="margin-top:10px">${doneShown.map(taskHtml).join('')}</ul>`;
  }
  $('list').innerHTML = html;

  const ed = document.querySelector('[data-editinput]');
  if (ed) { ed.focus(); ed.select(); }
}

function taskHtml(t) {
  const title = ui.editing === t.id
    ? `<input data-editinput="${t.id}" value="${esc(t.title)}" maxlength="200">`
    : esc(t.title);
  return `<li class="task k-${t.cat} ${t.done ? 'done' : ''}" data-task="${t.id}">
    <button class="check" data-toggle="${t.id}" aria-label="Готово">${svg('check')}</button>
    <div class="task-body">
      <div class="task-title" data-edit="${t.id}">${title}</div>
      ${theme().game ? jobMetaHtml(t) : ''}
    </div>
    <button class="tag k-${t.cat}" data-menu="${t.id}" aria-haspopup="menu" aria-expanded="false" title="Сменить категорию">${icon(t.cat)}<span>${cat(t.cat).name}</span>${chev}</button>
    <button class="del" data-del="${t.id}" aria-label="Удалить">${svg('trash')}</button>
  </li>`;
}

function hudHtml(alarms) {
  const { xp, credits } = state.stats;
  const level = Math.floor(xp / XP_PER_LEVEL) + 1;
  const into = xp % XP_PER_LEVEL;
  return `<div class="hud-top"><span>// журнал заказов</span><span>● сеть: онлайн</span></div>
    <div class="lvl"><span>Реп. <b>ур. ${level}</b></span>
      <div class="xp" role="progressbar" aria-valuemin="0" aria-valuemax="${XP_PER_LEVEL}" aria-valuenow="${into}"><i style="width:${(into / XP_PER_LEVEL) * 100}%"></i></div>
      <span class="xp-n">${into}/${XP_PER_LEVEL} XP</span></div>
    <div class="stats">
      <div class="stat" style="--sc:var(--pink)">Серия<b>${streak()} дн.</b></div>
      <div class="stat ${alarms ? 'hot' : ''}" style="--sc:var(--pink)">Срочно<b>${alarms}</b></div>
      <div class="stat gold" style="--sc:var(--gold)">Кредиты<b>¢ ${fmt(credits)}</b></div>
    </div>`;
}

function jobMetaHtml(t) {
  const r = REWARDS[t.cat];
  const bars = Array.from({ length: 5 }, (_, i) => `<i class="${i < r.threat ? '' : 'off'}"></i>`).join('');
  const status = t.done ? 'Выполнен' : t.cat === 'urgent' ? 'Срочно' : 'Активен';
  return `<div class="job-meta">
    <span class="threat" title="Уровень угрозы">${bars}</span>
    <span class="reward">+${r.xp} XP · ¢ ${fmt(r.cr)}</span>
    <span class="status ${!t.done && t.cat === 'urgent' ? 'hot' : ''}">${status}</span>
  </div>`;
}

let toastTimer;
function showToast(t, r) {
  const el = $('toast');
  el.className = `toast k-${t.cat}`;
  el.innerHTML = `${icon(t.cat)}<span>${cat(t.cat).done || 'Выполнено'}</span><b>+${r.xp} XP · ¢ ${fmt(r.cr)}</b>`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

function toggleTask(t) {
  t.done = !t.done;
  const st = state.stats;
  if (t.done && !t.reward) {
    const r = REWARDS[t.cat];
    t.reward = { xp: r.xp, cr: r.cr };
    st.xp += r.xp; st.credits += r.cr;
    const today = dayKey(new Date());
    if (!st.days.includes(today)) st.days = [...st.days, today].slice(-120);
    if (theme().game) showToast(t, r);
  } else if (!t.done && t.reward) {
    st.xp = Math.max(0, st.xp - t.reward.xp);
    st.credits = Math.max(0, st.credits - t.reward.cr);
    delete t.reward;
  }
  commit();
}

/* ---------- Actions ---------- */
function findTask(id) { return active().tasks.find((t) => t.id === id); }
function commit() { save(); render(); }

function setPlainNames(on) {
  if (state.plainNames === on) return;
  state.plainNames = on;
  commit();
}

function setTheme(id) {
  if (!THEMES[id] || id === state.theme) return;
  state.theme = id;
  commit();
}

function addProject(name) {
  name = (name || '').trim();
  if (!name) return;
  const p = { id: uid(), name, tasks: [] };
  state.projects.push(p);
  state.activeId = p.id;
  ui.filter = 'all';
  commit();
}
function deleteProject(id) {
  const p = state.projects.find((x) => x.id === id);
  if (!p || !confirm(`Удалить проект «${p.name}» со всеми задачами?`)) return;
  state.projects = state.projects.filter((x) => x.id !== id);
  if (state.activeId === id) state.activeId = state.projects[0]?.id;
  commit();
}
function selectProject(id) { state.activeId = id; ui.filter = 'all'; ui.editing = null; commit(); }

$('addProj').addEventListener('submit', (e) => {
  e.preventDefault();
  addProject($('projInput').value);
  $('projInput').value = '';
});
$('projList').addEventListener('click', (e) => {
  const del = e.target.closest('[data-delproj]');
  if (del) { e.stopPropagation(); return deleteProject(del.dataset.delproj); }
  const b = e.target.closest('[data-proj]');
  if (b) selectProject(b.dataset.proj);
});
$('projSelect').addEventListener('change', (e) => selectProject(e.target.value));
$('mAdd').addEventListener('click', () => addProject(prompt('Название проекта или области')));
$('mDel').addEventListener('click', () => active() && deleteProject(active().id));

$('projTitle').addEventListener('dblclick', () => {
  const p = active(); if (!p) return;
  const name = prompt('Переименовать проект', p.name);
  if (name && name.trim()) { p.name = name.trim(); commit(); }
});


/* ---------- Dropdown menu ---------- */
let menuCtx = null;

// items: [{ id, name, hint, iconHtml, cls?, style? }]
function openMenu(anchor, { title, items, current, onPick }) {
  if (menuCtx && menuCtx.anchor === anchor) return closeMenu();
  closeMenu();
  const menu = $('menu');
  const checked = [].concat(current);
  menu.innerHTML = (title ? `<div class="menu-title">${title}</div>` : '') + items.map((it) => it.section
    ? `<div class="menu-title">${it.section}</div>`
    : `<button type="button" role="menuitem" class="${it.cls || ''}" data-pick="${it.id}">
      <span class="mi tinted" ${it.style ? `style="${it.style}"` : ''}>${it.iconHtml}</span>
      <span><b>${it.name}</b><small>${it.hint}</small></span>
      ${checked.includes(it.id) ? svg('check', 'ico tick') : ''}
    </button>`).join('');
  menu.style.left = menu.style.top = '0px';
  menu.hidden = false;
  anchor.setAttribute('aria-expanded', 'true');
  menuCtx = { anchor, onPick };

  // position below the anchor, flip up if it doesn't fit, keep inside viewport
  const r = anchor.getBoundingClientRect();
  const m = menu.getBoundingClientRect();
  const bar = document.querySelector('.mbar');
  const bottomLimit = innerHeight - (bar.contains(anchor) ? 0 : bar.offsetHeight) - 8;
  const top = r.bottom + 6 + m.height > bottomLimit ? r.top - 6 - m.height : r.bottom + 6;
  const left = Math.min(Math.max(8, r.right - m.width), innerWidth - m.width - 8);
  menu.style.top = `${Math.max(8, top)}px`;
  menu.style.left = `${Math.max(8, Math.min(left, r.left))}px`;
  (menu.querySelector(`[data-pick="${checked[0]}"]`) || menu.querySelector('button')).focus({ preventScroll: true });
}

function catMenu(anchor, current, onPick) {
  openMenu(anchor, {
    current, onPick,
    items: ORDER.map((k) => ({ id: k, cls: `k-${k}`, iconHtml: icon(k), ...cat(k) })),
  });
}

function closeMenu() {
  if (!menuCtx) return;
  menuCtx.anchor.setAttribute('aria-expanded', 'false');
  $('menu').hidden = true;
  menuCtx = null;
}

$('menu').addEventListener('click', (e) => {
  const b = e.target.closest('[data-pick]');
  if (!b || !menuCtx) return;
  const pick = menuCtx.onPick;
  closeMenu();
  pick(b.dataset.pick);
});
$('menu').addEventListener('keydown', (e) => {
  const items = [...$('menu').querySelectorAll('button')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
});
document.addEventListener('pointerdown', (e) => {
  if (menuCtx && !$('menu').contains(e.target) && !menuCtx.anchor.contains(e.target)) closeMenu();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && menuCtx) { const a = menuCtx.anchor; closeMenu(); a.focus(); }
});
addEventListener('resize', closeMenu);
addEventListener('scroll', closeMenu, true);

function themeMenu(e) {
  openMenu(e.currentTarget, {
    title: 'Вселенная',
    current: [state.theme, state.plainNames ? 'names:plain' : 'names:theme'],
    onPick: (id) => id.startsWith('names:') ? setPlainNames(id === 'names:plain') : setTheme(id),
    items: [
      ...Object.entries(THEMES).map(([id, t]) => ({
        id, name: t.label, hint: t.hint, iconHtml: svg(t.brandIcon), style: `background:${t.swatch};color:#fff`,
      })),
      { section: 'Названия срочности' },
      { id: 'names:theme', name: 'Из вселенной', hint: ORDER.slice(0, 3).map((k) => theme().cats[k].name).join(', ') + '…',
        iconHtml: icon('urgent'), cls: 'k-urgent' },
      { id: 'names:plain', name: 'Стандартные', hint: 'Срочное, важное, неприятное…',
        iconHtml: svg('list'), style: 'background:var(--bg);color:var(--ink)' },
    ],
  });
}
$('themeBtn').addEventListener('click', themeMenu);
$('mTheme').addEventListener('click', themeMenu);

$('pickBtn').addEventListener('click', (e) => {
  catMenu(e.currentTarget, ui.newCat, (k) => { ui.newCat = k; render(); $('taskInput').focus(); });
});
$('composer').addEventListener('submit', (e) => {
  e.preventDefault();
  const title = $('taskInput').value.trim();
  if (!title || !active()) return;
  active().tasks.unshift({ id: uid(), title, cat: ui.newCat, done: false, created: Date.now() });
  $('taskInput').value = '';
  if (ui.filter !== 'all' && ui.filter !== ui.newCat) ui.filter = 'all';
  ui.newCat = ui.filter === 'all' ? DEFAULT_CAT : ui.filter;
  commit();
});

$('filters').addEventListener('click', (e) => {
  const b = e.target.closest('[data-filter]');
  if (!b) return;
  ui.filter = ui.filter === b.dataset.filter ? 'all' : b.dataset.filter;
  ui.newCat = ui.filter === 'all' ? DEFAULT_CAT : ui.filter;
  render();
});

$('list').addEventListener('click', (e) => {
  const el = e.target.closest('[data-toggle],[data-menu],[data-del],[data-toggledone]');
  if (!el) return;
  if ('toggledone' in el.dataset) { ui.showDone = !ui.showDone; return render(); }
  if (el.dataset.toggle) return toggleTask(findTask(el.dataset.toggle));
  if (el.dataset.menu) {
    const t = findTask(el.dataset.menu);
    return catMenu(el, t.cat, (k) => { t.cat = k; commit(); });
  }
  if (el.dataset.del) { active().tasks = active().tasks.filter((t) => t.id !== el.dataset.del); return commit(); }
});
$('list').addEventListener('dblclick', (e) => {
  const el = e.target.closest('[data-edit]');
  if (el && !ui.editing) { ui.editing = el.dataset.edit; render(); }
});
function finishEdit(input, keep) {
  const t = findTask(input.dataset.editinput);
  if (t && keep && input.value.trim()) t.title = input.value.trim();
  ui.editing = null;
  commit();
}
$('list').addEventListener('keydown', (e) => {
  if (!e.target.dataset.editinput) return;
  if (e.key === 'Enter') finishEdit(e.target, true);
  if (e.key === 'Escape') finishEdit(e.target, false);
});
$('list').addEventListener('focusout', (e) => {
  if (e.target.dataset.editinput && ui.editing) finishEdit(e.target, true);
});

render();
</script>
</body>
</html>
